version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request a month for all minor and patch updates together,
      # and one for all major updates. When a major update breaks the build,
      # add it to `ignore` below until it can be done, so the rest goes ahead.
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # typescript-eslint, which the linter needs, does not support TypeScript
      # 7 yet: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # Remove this once it does.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
