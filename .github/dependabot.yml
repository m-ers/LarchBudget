version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request a month for all minor and patch updates together.
      # Major updates, which can break things, each get their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint, which the linter needs, does not support TypeScript
      # 7 yet: https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # Remove this once it does.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
