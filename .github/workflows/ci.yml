name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Clicks through the production build in a real browser.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        # Also after a retry that passed, so a flaky test keeps its trace.
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Builds the Docker image and checks that it serves the budget from its
  # volume, on an Intel/AMD and on an ARM machine: the published image is
  # made for both.
  docker:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t larchbudget .
      - name: Start the image
        run: docker run -d --name larchbudget -p 3000:3000 -v larchbudget-data:/data larchbudget
      - name: The budget page is served
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > page.html && break
            sleep 1
          done
          grep -q "Ready to assign" page.html
      - name: The database is in the volume
        run: docker exec larchbudget test -f /data/larchbudget.db
      - name: Server log
        if: always()
        run: docker logs larchbudget
