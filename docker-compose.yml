# Starts LarchBudget from its published image. See docs/installing.md.
services:
  larchbudget:
    # `latest` is the newest release. Put a version here, such as 0.1.0, to
    # stay on that one.
    image: ghcr.io/m-ers/larchbudget:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Set a password before exposing the app beyond your own machine.
      APP_PASSWORD: ${APP_PASSWORD:-}
      CURRENCY: ${CURRENCY:-EUR}
      LOCALE: ${LOCALE:-en-US}
      # Your time zone decides what "today" and "this month" are.
      TZ: ${TZ:-UTC}
    volumes:
      - larchbudget-data:/data

volumes:
  larchbudget-data:
